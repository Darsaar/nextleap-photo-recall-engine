<meta charset="utf-8">
<title>Photo Recall Engine</title>
<meta name="description" content="AI discovery engine: what people remember, forget and type when they can't find a photo in Google Photos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a research notebook — one reading column for findings, wide panels for the map, explorer and chat. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#16202b; --muted:#5b6876; --line:#dde2e8;
  --accent:#1f5fbf;            /* "search" blue */
  --c1:#0072b2; --c2:#e69f00; --c3:#009e73; --c4:#cc79a7; --c5:#56b4e9; --c6:#d55e00; --c7:#7f7f7f; /* Okabe–Ito, colour-blind safe */
  --heat0:#eef3fa; --heat1:#1f5fbf;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151c; --panel:#171e27; --ink:#e7ecf2; --muted:#9aa7b5; --line:#2a3440; --accent:#7fb0ff; --heat0:#1b2430; --heat1:#5f9cff; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c; --panel:#171e27; --ink:#e7ecf2; --muted:#9aa7b5; --line:#2a3440; --accent:#7fb0ff; --heat0:#1b2430; --heat1:#5f9cff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{font:700 1.35rem/1.1 var(--display);letter-spacing:-.01em}
.brand small{display:block;font:400 .8rem var(--body);color:var(--muted);letter-spacing:0;margin-top:4px}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px}
nav.tabs button{font:500 .85rem var(--body);background:none;border:1px solid transparent;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--line);background:var(--panel)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.tab{padding-top:24px}
h1{font:700 clamp(1.6rem,3.6vw,2.4rem)/1.12 var(--display);letter-spacing:-.02em;margin:8px 0 10px;text-wrap:balance;max-width:24ch}
h2{font:700 1.25rem/1.2 var(--display);margin:34px 0 8px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--body);margin:0 0 6px}
p{margin:0 0 10px;max-width:68ch}
.lede{font-size:1.06rem;color:var(--muted);max-width:66ch}
.eyebrow{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:18px 0}
.funnel div{background:var(--panel);padding:12px 14px}
.funnel b{display:block;font:700 1.5rem var(--display)}
.funnel span{font-size:.8rem;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid2>*{min-width:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.r,th.r{text-align:right}
.finding{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:16px 0}
.finding .eyebrow{color:var(--muted)}
.boundary{border:1px dashed var(--muted);border-radius:8px;padding:14px 16px;margin:18px 0}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;gap:8px;align-items:center;font-size:.86rem;margin:5px 0}
.bar .track{height:12px;background:var(--heat0);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.opp{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:10px 0}
.opp summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center}
.opp summary::-webkit-details-marker{display:none}
.opp .rank{font:700 1.1rem var(--display);color:var(--muted)}
.opp .score{font:700 1.3rem var(--display);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:500 .74rem var(--mono);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.opp .body{padding:0 16px 16px}
.quote{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem}
.quote q{quotes:"“" "”"}
.quote .meta{font:.74rem var(--mono);color:var(--muted);margin-top:4px}
a{color:var(--accent)}
.heat{border-collapse:separate;border-spacing:2px;font-size:.8rem}
.heat td,.heat th{border:0;padding:6px;text-align:center}
.heat th{white-space:nowrap}
.heat td.lab{text-align:left;white-space:nowrap;color:var(--ink)}
.heat td.c{border-radius:3px;min-width:44px;cursor:pointer}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.filters select,.filters input,.ask input{font:inherit;font-size:.9rem;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0}
.filters input{flex:1 1 220px}
.card{border-bottom:1px solid var(--line);padding:12px 0}
.card .tags{font:.74rem var(--mono);color:var(--muted);margin-top:6px}
.btn{font:500 .88rem var(--body);background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.ask{display:flex;gap:8px;flex-wrap:wrap}
.ask input{flex:1 1 280px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.presets button{font:inherit;font-size:.82rem;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;text-align:left}
.answer{margin-top:14px}
.answer .ai{white-space:pre-wrap;font-size:1rem;line-height:1.6}
.answerbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.more{margin-top:12px}
.more summary{cursor:pointer;color:var(--accent);font-weight:500;padding:8px 0}
.asec+.asec{border-top:6px solid var(--bg)}
.asec header{display:flex;gap:12px;align-items:flex-start;background:var(--heat0);padding:12px 16px;border-bottom:1px solid var(--line)}
.asec header h3{margin:0;font:600 1rem/1.3 var(--body)}
.asec header p{margin:2px 0 0;font-size:.8rem;color:var(--muted);max-width:none}
.snum{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--panel);display:grid;place-items:center;font:700 .85rem var(--body)}
.abody{padding:14px 16px}
.ai-sec .abody{font-size:1rem}
.abody>p:last-child{margin-bottom:0}
.abody .quote:first-child{border-top:0;padding-top:0}
.aibox{background:var(--heat0);border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px}
.answer .sec{margin-top:16px}
.note{font-size:.8rem;color:var(--muted);margin:10px 0 0;max-width:none}
.hyp{display:grid;grid-template-columns:44px 1fr;gap:10px;border-top:1px solid var(--line);padding:12px 0}
.hyp b.h{font:700 1.1rem var(--display);color:var(--accent)}
ol.steps{padding-left:20px} ol.steps li{margin:6px 0}
pre.code{white-space:pre-wrap;font:.78rem/1.5 var(--mono);background:var(--heat0);padding:12px;border-radius:6px;overflow-x:auto;max-height:340px}
footer{margin-top:48px;font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.bar{grid-template-columns:110px 1fr 36px}.opp summary{grid-template-columns:22px 1fr}.opp .score{grid-column:2}}
</style>

<div class="wrap">
<header class="top">
  <div class="brand">Photo Recall Engine<small>Google Photos · why vaguely remembered photos are hard to retrieve</small></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>

<section class="tab" id="t-findings"></section>
<section class="tab" id="t-map" hidden></section>
<section class="tab" id="t-cues" hidden></section>
<section class="tab" id="t-evidence" hidden></section>
<section class="tab" id="t-ask" hidden></section>
<section class="tab" id="t-method" hidden></section>
<footer id="foot"></footer>
</div>

<script>
const ENGINE = /*__ENGINE__*/null;
const EVID = /*__EVIDENCE__*/[];
const STORY = /*__STORY__*/{};
const META = /*__META__*/{};

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n).toLocaleString("en-IN");
const pct = (a,b) => b ? Math.round(100*a/b) + "%" : "–";
const SRC = {play_store:"Google Play", app_store:"App Store", reddit:"Reddit", help_forum:"Photos Help Community", youtube:"YouTube", hacker_news:"Hacker News", stack_exchange:"Stack Exchange", play_store_deep:"Google Play"};
const NICE = {other:"Not stated / other", unknown:"Not stated", trip_place:"Trip / place", event_occasion:"Event / occasion", child_family:"Child / family", screenshot_info:"Screenshot", document_id:"Document / ID", receipt_bill:"Receipt / bill", product_shopping:"Product / shopping", text_in_image:"Text in image", old_scanned:"Old / scanned", scroll_timeline:"Scrolled the timeline", gave_up:"Gave up", other_app:"Used another app", albums_folders:"Albums / folders", people_tab:"People tab", date_jump:"Jumped to a date", ask_someone:"Asked someone", map_or_places:"Map / places", third_party_tool:"Third-party tool", not_found:"Not found", found_with_effort:"Found with effort", retrieval_story:"Retrieval story", search_feedback:"Search feedback", off_goal:"Off-goal", none:"None"};
const nice = s => (ENGINE.stage_labels||{})[s] || NICE[s] || String(s||"").replace(/_/g," ");
const CUE = {rough_time:"Rough time", exact_date:"Exact date", place:"Place", person:"Person", object:"Object / thing in it", text_in_image:"Words in the image", event_context:"The event", life_context:"What was going on in life", visual_look:"How it looked (colour, scene)", source_app:"Which app it came from", why_taken:"Why they took it", device:"Device", date:"Date", album_folder:"Album / folder", what_to_type:"What to type", who_sent:"Who sent it", which_account_device:"Which account / device", filename:"File name"};
const cue = c => CUE[c] || nice(c);

const TABS = [["findings","Findings"],["map","Opportunity map"],["cues","Memory cues"],["evidence","Evidence"],["ask","Ask the engine"],["method","Method"]];
function show(id){
  TABS.forEach(([t]) => { $("#t-"+t).hidden = t!==id; $("#tab-"+t).setAttribute("aria-selected", t===id); });
  try{ localStorage.setItem("tab", id) }catch(e){}
}
$("#tabs").innerHTML = TABS.map(([t,l]) => `<button role="tab" id="tab-${t}" aria-selected="false">${l}</button>`).join("");
TABS.forEach(([t]) => $("#tab-"+t).onclick = () => show(t));

function bars(list, total, color, fmtLabel=cue){
  const max = Math.max(1, ...list.map(x=>x[1]));
  return list.map(([k,v]) => `<div class="bar"><span>${esc(fmtLabel(k))}</span><div class="track"><div class="fill" style="width:${100*v/max}%;background:${color}"></div></div><span class="num muted">${total?pct(v,total):fmt(v)}</span></div>`).join("");
}

/* ---------- Findings ---------- */
function renderFindings(){
  const F = ENGINE.funnel, S = ENGINE.sources;
  const srcRows = Object.entries(S).sort((a,b)=>b[1].stories-a[1].stories);
  $("#t-findings").innerHTML = `
  <div class="eyebrow">AI discovery engine · ${fmt(F.raw)} public posts · ${srcRows.length} sources</div>
  <h1>${esc(STORY.headline)}</h1>
  <p class="lede">${esc(STORY.dek)}</p>
  <div class="funnel">
    <div><b class="num">${fmt(F.raw)}</b><span>posts collected</span></div>
    <div><b class="num">${fmt(F.clean)}</b><span>after dedupe + language</span></div>
    <div><b class="num">${fmt(F.candidates)}</b><span>mention finding / searching</span></div>
    <div><b class="num">${fmt(F.tagged)}</b><span>read and tagged by the LLM</span></div>
    <div><b class="num">${fmt(F.stories)}</b><span>real retrieval stories</span></div>
    <div><b class="num">${fmt(F.feedback)}</b><span>search feedback</span></div>
  </div>
  <h2>Where the signal came from</h2>
  <p class="muted">Volume and usefulness are different things. "Story rate" is the share of tagged posts that describe someone actually trying to find a specific photo.</p>
  <div class="tablewrap"><table><thead><tr><th>Source</th><th class="r">Collected</th><th class="r">Tagged</th><th class="r">Retrieval stories</th><th class="r">Story rate</th><th class="r">Median words</th></tr></thead><tbody>
  ${srcRows.map(([k,v])=>`<tr><td>${SRC[k]||k}</td><td class="r num">${fmt(v.raw)}</td><td class="r num">${fmt(v.tagged)}</td><td class="r num">${fmt(v.stories)}</td><td class="r num">${Math.round(100*v.density)}%</td><td class="r num">${v.median_words||"–"}</td></tr>`).join("")}
  </tbody></table></div>
  <h2>What the engine found</h2>
  ${(STORY.findings||[]).map((f,i)=>`<div class="finding"><div class="eyebrow">Finding ${i+1}${f.tag?" · "+esc(f.tag):""}</div><h3>${esc(f.title)}</h3><p>${esc(f.body)}</p></div>`).join("")}
  <div class="boundary"><div class="eyebrow">What this data can't show</div><p>${esc(STORY.boundary)}</p></div>
  <h2>Hypotheses for the survey and interviews</h2>
  ${(STORY.hypotheses||[]).map(h=>`<div class="hyp"><b class="h">${esc(h.id)}</b><div><h3>${esc(h.claim)}</h3><p class="muted">Engine signal: ${esc(h.signal)}</p><p class="muted">Validate with: ${esc(h.validate)}</p></div></div>`).join("")}
  `;
}

/* ---------- Opportunity map ---------- */
function renderMap(){
  const O = ENGINE.opportunities, M = ENGINE.matrix;
  const stages = O.map(o=>o.stage);
  const types = Object.entries(M).map(([t,v])=>[t,Object.values(v).reduce((a,b)=>a+b,0)]).sort((a,b)=>b[1]-a[1]).filter(x=>x[0]!=="unknown").slice(0,12);
  const max = Math.max(1,...types.flatMap(([t])=>stages.map(s=>M[t]?.[s]||0)));
  const mix = v => `color-mix(in oklab, var(--heat1) ${Math.round(100*v/max)}%, var(--heat0))`;
  $("#t-map").innerHTML = `
  <div class="eyebrow">Opportunity areas</div>
  <h1>Where retrieval breaks, ranked by what a product change could move</h1>
  <p class="lede">Each area is a stage of the retrieval journey. Score = √mentions × (0.5 + severity) × (0.5 + source spread) × addressability. Addressability is lower when the cause is backup or storage, which better search can't fix. Open a row for the posts behind it.</p>
  ${O.map((o,i)=>`<details class="opp"${i===0?" open":""}><summary><span class="rank">${i+1}</span><div><h3>${esc(o.label)}</h3>
    <div class="chips"><span class="chip">${o.mentions} posts</span><span class="chip">${Math.round(o.prevalence*100)}% of evidence</span><span class="chip">severity ${o.severity} of 1</span><span class="chip">${o.sources} sources</span><span class="chip">not found ${Math.round(o.not_found_rate*100)}%</span><span class="chip">addressable ${o.addressable}</span></div></div>
    <span class="score num">${o.score}</span></summary>
    <div class="body"><p class="muted">Most affected: ${o.content_types.map(([k,v])=>esc(nice(k))+" ("+v+")").join(", ")}. Workarounds: ${o.workarounds.map(([k,v])=>esc(nice(k))+" ("+v+")").join(", ")||"none stated"}.</p>
    ${o.quotes.map(q=>quoteHTML(q)).join("")}</div></details>`).join("")}
  <h2>Photo type × where it broke</h2>
  <p class="muted">Retrieval stories only. Click a cell to see those posts in Evidence.</p>
  <div class="tablewrap"><table class="heat"><thead><tr><th></th>${stages.map(s=>`<th title="${esc(nice(s))}">${esc(s.replace(/_/g," "))}</th>`).join("")}</tr></thead><tbody>
  ${types.map(([t])=>`<tr><td class="lab">${esc(nice(t))}</td>${stages.map(s=>{const v=M[t]?.[s]||0;return `<td class="c num" data-t="${t}" data-s="${s}" style="background:${mix(v)};color:${v>max*.55?"var(--panel)":"var(--ink)"}">${v||""}</td>`}).join("")}</tr>`).join("")}
  </tbody></table></div>`;
  $("#t-map").querySelectorAll("td.c").forEach(td=>td.onclick=()=>{ $("#f-type").value=td.dataset.t; $("#f-stage").value=td.dataset.s; $("#f-rel").value="retrieval_story"; drawEvidence(); show("evidence"); });
}
function quoteHTML(q){
  return `<div class="quote">${q.n?`<b class="num">[${q.n}]</b> `:""}<q>${esc(q.q)}</q><div class="meta">${[SRC[q.source]||q.source, q.date, nice(q.type), nice(q.stage)].filter(Boolean).map(esc).join(" · ")} · <a href="${esc(q.url)}" target="_blank" rel="noopener">source</a></div></div>`;
}

/* ---------- Memory cues ---------- */
function renderCues(){
  const E = ENGINE, n = E.funnel.stories;
  const typed = Object.fromEntries(E.typed_cues), withQ = E.queries.length;
  $("#t-cues").innerHTML = `
  <div class="eyebrow">Memory cues · ${fmt(n)} retrieval stories</div>
  <h1>${esc(STORY.cues_headline||"What people remember is not what they can search for")}</h1>
  <p class="lede">${esc(STORY.cues_dek||"")}</p>
  <div class="grid2">
    <div class="panel"><h3>What they remembered</h3><p class="muted">Share of retrieval stories mentioning each cue.</p>${bars(E.remembered.slice(0,12), n, "var(--c1)")}</div>
    <div class="panel"><h3>What they had forgotten</h3><p class="muted">Share of retrieval stories.</p>${bars(E.forgotten.slice(0,8), n, "var(--c2)")}</div>
  </div>
  <div class="grid2" style="margin-top:16px">
    <div class="panel"><h3>Kinds of photos people struggle to find</h3>${bars(E.content_types.slice(0,12), n, "var(--c3)", nice)}</div>
    <div class="panel"><h3>What they did instead</h3>${bars(E.workarounds.slice(0,9), n, "var(--c4)", nice)}<h3 style="margin-top:14px">Outcome</h3>${bars(E.outcomes, n, "var(--c7)", nice)}</div>
  </div>
  <h2>How people phrase a half-remembered photo</h2>
  <p class="muted">${fmt(withQ)} stories quote the words they typed. Next to each: the cues they say they remembered.</p>
  <div class="tablewrap"><table><thead><tr><th>Typed into search</th><th>What they remembered</th><th>Where it broke</th><th>Source</th></tr></thead><tbody>
  ${E.queries.slice(0,60).map(q=>`<tr><td><code>${esc(q.query)}</code></td><td>${q.remembered.map(cue).map(esc).join(", ")}</td><td>${esc(nice(q.stage))}</td><td><a href="${esc(q.url)}" target="_blank" rel="noopener">${SRC[q.source]||q.source}</a></td></tr>`).join("")}
  </tbody></table></div>`;
}

/* ---------- Evidence explorer ---------- */
const uniq = k => [...new Set(EVID.flatMap(r => Array.isArray(r[k]) ? r[k] : [r[k]]).filter(Boolean))].sort();
function opt(id, label, vals, f=nice){ return `<select id="${id}" aria-label="${label}"><option value="">${label}: all</option>${vals.map(v=>`<option value="${esc(v)}">${esc(f(v))}</option>`).join("")}</select>`; }
function renderEvidenceShell(){
  $("#t-evidence").innerHTML = `
  <div class="eyebrow">Evidence explorer</div>
  <h1>Every tagged post, traceable to its source</h1>
  <div class="filters">
    <input id="f-q" type="search" placeholder="Search the text, e.g. receipt, wedding, WhatsApp">
    ${opt("f-src","Source",uniq("source"),s=>SRC[s]||s)}
    ${opt("f-rel","Kind",uniq("relevance"))}
    ${opt("f-type","Photo type",uniq("content_type"))}
    ${opt("f-stage","Broke at",uniq("failure_stage"))}
    ${opt("f-cue","Remembered",uniq("cues_remembered"),cue)}
  </div>
  <p class="muted" id="ev-count"></p><div id="ev-list"></div>`;
  ["f-q","f-src","f-rel","f-type","f-stage","f-cue"].forEach(id=>$("#"+id).addEventListener("input", drawEvidence));
}
function filtered(){
  const q=$("#f-q").value.toLowerCase().trim(), s=$("#f-src").value, rel=$("#f-rel").value, t=$("#f-type").value, st=$("#f-stage").value, c=$("#f-cue").value;
  return EVID.filter(r=>(!s||r.source===s)&&(!rel||r.relevance===rel)&&(!t||r.content_type===t)&&(!st||r.failure_stage===st)&&(!c||(r.cues_remembered||[]).includes(c))&&(!q||(r.text+" "+r.quote+" "+r.user_need).toLowerCase().includes(q)));
}
function drawEvidence(){
  const rows = filtered();
  $("#ev-count").textContent = `${fmt(rows.length)} of ${fmt(EVID.length)} posts`;
  $("#ev-list").innerHTML = rows.slice(0,80).map(r=>`<div class="card"><q>${esc(r.quote||r.text.slice(0,260))}</q>
    <div class="tags">${SRC[r.source]||r.source} · ${esc(r.date||"")} · ${esc(nice(r.relevance))} · ${esc(nice(r.content_type))} · broke at: ${esc(nice(r.failure_stage))}${r.query_typed?` · typed: “${esc(r.query_typed)}”`:""} · remembered: ${(r.cues_remembered||[]).map(cue).map(esc).join(", ")||"–"} · <a href="${esc(r.url)}" target="_blank" rel="noopener">open source</a></div>
    ${r.user_need?`<div class="tags">Need: ${esc(r.user_need)}</div>`:""}</div>`).join("") + (rows.length>80?`<p class="muted">Showing the first 80. Narrow the filters to see more.</p>`:"");
}

/* ---------- Ask the engine ---------- */
const STOP = new Set("the a an of to in on for and or is are was were do does did i my me it this that what which who how why when where with from at by as be can cant can't not no photos photo google users user people".split(" "));
const toks = s => (s.toLowerCase().match(/[a-z0-9']+/g)||[]).filter(w=>!STOP.has(w)&&w.length>2);
const DF = {}; const DOCS = EVID.map(r=>{ const t=toks(r.text+" "+(r.user_need||"")+" "+(r.query_typed||"")+" "+(r.content_type||"")+" "+(r.failure_stage||"")); new Set(t).forEach(w=>DF[w]=(DF[w]||0)+1); return t; });
function retrieve(q,k=12){
  const qt=toks(q), N=DOCS.length, avg=DOCS.reduce((a,d)=>a+d.length,0)/Math.max(1,N);
  return DOCS.map((d,i)=>{ let s=0; const tf={}; d.forEach(w=>tf[w]=(tf[w]||0)+1);
    qt.forEach(w=>{ if(!tf[w])return; const idf=Math.log(1+(N-DF[w]+.5)/(DF[w]+.5)); s+=idf*tf[w]*2.2/(tf[w]+1.2*(.25+.75*d.length/avg)); });
    if(EVID[i].relevance==="retrieval_story") s*=1.5; return [s,i]; }).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,k).map(x=>EVID[x[1]]);
}
// Topic matching: which posts are actually about the question's subject (all of its topic words, or any if too few match).
const stem = w => w.replace(/ies$/,"y").replace(/([^s])s$/,"$1");
const GEN = new Set("say about goe go wrong search searching searched find finding found most problem issue happen thing get got use using used way want need try trying tried face their they them there some any all just like".split(" "));
const SDOCS = DOCS.map(d=>new Set(d.map(stem)));
function matchSet(q){
  const qt=[...new Set(toks(q).map(stem))].filter(w=>!GEN.has(w));
  if(!qt.length) return null;
  const all=EVID.filter((r,i)=>qt.every(w=>SDOCS[i].has(w)));
  return all.length>=5 ? all : EVID.filter((r,i)=>qt.some(w=>SDOCS[i].has(w)));
}
function countsFor(rows){ const c=(k)=>{const m={};rows.forEach(r=>[].concat(r[k]||[]).forEach(v=>{if(v&&!/^\s*none|unknown|^other$/.test(v))m[v]=(m[v]||0)+1}));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5)}; return {types:c("content_type"),stages:c("failure_stage"),remembered:c("cues_remembered"),forgotten:c("cues_forgotten"),workarounds:c("workaround")}; }
let sampleNS = null;
(async()=>{ try{ if(window.claude?.use){ sampleNS = await window.claude.use("sample"); } }catch(e){} })();
function renderAsk(){
  $("#t-ask").innerHTML = `
  <div class="eyebrow">Ask the engine</div>
  <h1>Ask a question of ${fmt(EVID.length)} real posts</h1>
  <p class="lede">Counts come from the tagged data. Quotes come from the posts themselves, each linked to its source. ${META.chat_note||""}</p>
  <form class="ask" id="ask-form"><input id="ask-q" type="text" placeholder="e.g. How do people describe screenshots they can't find?" aria-label="Your question"><button class="btn" type="submit">Ask</button></form>
  <div class="presets">${(STORY.questions||[]).map(q=>`<button type="button">${esc(q)}</button>`).join("")}</div>
  <div class="answer" id="ask-out"></div>`;
  $("#ask-form").addEventListener("submit", e=>{ e.preventDefault(); ask($("#ask-q").value); });
  $("#t-ask").querySelectorAll(".presets button").forEach(b=>b.onclick=()=>{ $("#ask-q").value=b.textContent; ask(b.textContent); });
}
let askCtl=null;
const INTENTS = [
  [/(problem|issue|pain|struggl|break|wrong|fail|complain).*(most|biggest|top|common|main|frequent)|(most|biggest|top|common|main|frequent).*(problem|issue|pain|struggl|break|wrong|fail|complain)/i, "failure_stage", "Where search breaks, across all retrieval posts", nice],
  [/kind|type|what (photos|pictures)|which photos/i, "content_type", "Photo types across all retrieval stories", nice],
  [/forg[eo]t/i, "cues_forgotten", "What people had forgotten, across all retrieval stories", cue],
  [/remember|recall|know about/i, "cues_remembered", "What people remembered, across all retrieval stories", cue],
  [/instead|fallback|when search fails|do when|workaround|give up/i, "workaround", "What people did instead, across all retrieval stories", nice],
  [/phrase|type|word|query|formulat|search for it/i, "query_typed", "Searches people quoted, word for word", null],
];
function corpusCounts(field){ const m={}; EVID.filter(r=>field==="failure_stage"||r.relevance==="retrieval_story").forEach(r=>[].concat(r[field]||[]).forEach(v=>{if(v&&!/^\s*none|unknown/.test(v))m[v]=(m[v]||0)+1})); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8); }
async function ask(q){
  if(!q.trim()) return;
  const out=$("#ask-out"); const intent = INTENTS.find(i=>i[0].test(q));
  // Prefer posts that describe an actual failure; praise and chatter rarely answer a research question.
  let hits = retrieve(q, 80).filter(r=>(r.text||"").split(/\s+/).length>=12 && r.failure_stage && r.failure_stage!=="none");
  if(intent && intent[1]!=="query_typed") hits = hits.filter(r=>[].concat(r[intent[1]]||[]).some(v=>v&&!/^\s*none|unknown/.test(v))).concat(hits).filter((r,i,a)=>a.indexOf(r)===i);
  if(intent && intent[1]==="query_typed") hits = EVID.filter(r=>r.query_typed).sort((a,b)=>b.text.length-a.text.length);
  // Broad "what is most common" questions: show a spread of posts across the top failure stages, not keyword matches.
  if(intent && intent[1]==="failure_stage"){
    const byUrl = new Map(EVID.map(r=>[r.url,r]));
    hits = (ENGINE.opportunities||[]).slice(0,4).flatMap(o=>o.quotes.slice(0,2).map(qq=>byUrl.get(qq.url)||{quote:qq.q,text:qq.need||"",source:qq.source,url:qq.url,date:qq.date,content_type:qq.type,failure_stage:qq.stage}));
  }
  const matched = intent ? null : matchSet(q);
  if(matched && matched.length){ const ms=new Set(matched); hits = hits.filter(r=>ms.has(r)).concat(hits.filter(r=>!ms.has(r))); }
  hits = hits.slice(0,14);
  const pool = matched && matched.length ? matched : hits;
  const c = countsFor(pool);
  // What the AI reads: for topic questions, every matching post (most relevant first, capped at 150); otherwise the 8 shown.
  let readList = hits.slice(0,8);
  if(matched && matched.length){
    const rk = new Map(retrieve(q, EVID.length).map((r,i)=>[r,i])); const first = new Set(readList);
    readList = readList.concat(matched.filter(r=>!first.has(r)).sort((a,b)=>(rk.get(a)??1e9)-(rk.get(b)??1e9))).slice(0,150);
  }
  const readsAll = readList.length > 8;
  const line = (lab, arr, f=nice) => arr.length?`<p><b>${lab}</b><br>${arr.slice(0,3).map(([k,v])=>esc(f(k))+" ("+v+" post"+(v>1?"s":"")+")").join(", ")}</p>`:"";
  let head = "";
  if(intent && intent[1]!=="query_typed"){ const n=intent[1]==="failure_stage"?EVID.length:ENGINE.funnel.stories; head = `<div class="eyebrow">${esc(intent[2])} · ${fmt(n)} ${intent[1]==="failure_stage"?"posts":"stories"}</div>${bars(corpusCounts(intent[1]), n, "var(--c1)", intent[3])}`; }
  if(intent && intent[1]==="query_typed"){ const R=ENGINE.richness; head = `<div class="eyebrow">${esc(intent[2])}</div><p>${fmt(R.queries_quoted)} stories quote their search. Median length: ${R.query_median_words} word. ${Math.round(R.share_queries_1_2_words*100)}% are one or two words.</p><p>${EVID.filter(r=>r.query_typed).slice(0,24).map(r=>`<code>${esc(r.query_typed)}</code>`).join(" · ")}</p>`; }
  const hasAI = !!(sampleNS || META.ask_endpoint);
  const secs = [];
  if(hasAI) secs.push(["AI summary", readsAll ? `Written by AI after reading ${fmt(readList.length)} matching posts${pool.length>readList.length?` (the ${readList.length} most relevant of ${fmt(pool.length)})`:""}. A number like [2] points to a source post below.` : "Written by AI from the numbered source posts. A number like [2] points to that post.", `<div id="ai" class="ai muted"></div>`, "ai-sec"]);
  if(head) secs.push(["Across all posts", "", head, ""]);
  if(!intent) secs.push([`At a glance · ${fmt(pool.length)} of ${fmt(EVID.length)} posts match your question`, "Counted across every post that mentions your topic, so these change with every question. The source posts below are the 8 most relevant.", line("What photo were they looking for?",c.types)+line("Where did search let them down?",c.stages)+line("What did they still remember?",c.remembered,cue)+line("What had they forgotten?",c.forgotten,cue)+line("What did they do instead?",c.workarounds), ""]);
  secs.push(["Source posts", "Real quotes from users, each linked to where it was posted.", readList.slice(0,8).map((r,i)=>quoteHTML({n:i+1,q:r.quote||r.text.slice(0,240),source:r.source,url:r.url,date:r.date,type:r.content_type,stage:r.failure_stage})).join("")+(readsAll?`<details class="more"><summary>Show all ${readList.length} posts the AI read</summary>${readList.slice(8).map((r,i)=>quoteHTML({n:i+9,q:r.quote||(r.text||"").slice(0,240),source:r.source,url:r.url,date:r.date,type:r.content_type,stage:r.failure_stage})).join("")}</details>`:""), ""]);
  out.innerHTML = `<div class="answerbox">${secs.map(([t,sub,body,cls],k)=>`<section class="asec ${cls}"><header><span class="snum">${k+1}</span><div><h3>${esc(t)}</h3>${sub?`<p>${esc(sub)}</p>`:""}</div></header><div class="abody">${body}</div></section>`).join("")}</div>`;
  const ai=$("#ai") || document.createElement("div");
  const stats = intent && intent[1]!=="query_typed" ? corpusCounts(intent[1]).map(([k,v])=>`${intent[3](k)}: ${v}`).join("; ") : "";
  const ctx = readList.map((r,i)=> i<8
    ? `[${i+1}] (${SRC[r.source]||r.source}; photo: ${nice(r.content_type)}; problem: ${nice(r.failure_stage)}; outcome: ${nice(r.outcome||"not stated")}) ${r.quote||""} | ${(r.text||"").slice(0,400)}`
    : `[${i+1}] (${nice(r.failure_stage)}; ${nice(r.outcome||"not stated")}) wanted: ${r.user_need||""} | "${r.quote||""}"`).join("\n");
  const oc = {}; pool.forEach(r=>{ if(r.outcome && !/none|unknown/.test(r.outcome)) oc[r.outcome]=(oc[r.outcome]||0)+1; });
  const fmtC = (arr,f=nice)=>arr.map(([k,v])=>`${f(k)} ${v}`).join(", ");
  const topicNums = readsAll ? `All ${pool.length} posts that match this question break down as: where search let them down: ${fmtC(c.stages)}; photo type: ${fmtC(c.types)}; what they remembered: ${fmtC(c.remembered,cue)}; what they did instead: ${fmtC(c.workarounds)}; outcome: ${fmtC(Object.entries(oc).sort((a,b)=>b[1]-a[1]))}.` : "";
  const top = (f,k=5)=>corpusCounts(f).slice(0,k).map(([k2,v])=>`${(f.startsWith("cues")?cue:nice)(k2)} ${v}`).join(", ");
  const overall = `Where search breaks (all ${EVID.length} posts): ${top("failure_stage",6)}. What people remember (${ENGINE.funnel.stories} stories): ${top("cues_remembered")}. What they do when search fails: ${top("workaround",4)}. Outcomes: ${top("outcome",3)}.`;
  const prompt = `You are a senior user researcher briefing a product manager on why people can't find photos in Google Photos. Use ONLY the numbered user posts and the numbers below.${readsAll?` You are given ${readList.length} posts that match the question: posts 1 to 8 with more of their text, the rest as a one-line summary plus a quote. Read all of them and describe what is common across them, not just the first few.`:""}

Write it like this:
1. One opening sentence that answers the question directly by naming the main problem (not the "not found" count), with the most relevant number.
2. Then 3 bullet points starting with "- ". Each bullet names a pattern you see across the posts (say how many posts share it when you know), explains WHY it happens for the user (what they remembered, what they tried, where it broke), and cites the posts like [2][5]. Quote a few words from a post when it makes the point vivid.
3. End with one line starting "What this means:" giving the product implication.

Rules: plain everyday words, no jargon ("index", "index gap", "failure stage", "retrieval", "corpus", "surface" are banned). Only claim "most" or "how often" from the overall numbers, and only when the question is about all users: the overall numbers cover every post, so never present them as counts for a narrower topic (e.g. do not call the overall "not found" count a number for screenshots). For a narrow topic, describe what the posts show instead of quoting overall numbers. If the posts don't answer the question, say so. 120 to 170 words. No bold, headings or other markdown.

${stats?`Numbers for this question: ${stats}\nOverall numbers: ${overall}`:topicNums?`${topicNums} Use these for any "most" or "how many" claim, e.g. "32 of the ${pool.length} posts".`:"No overall numbers apply to this question; use only the posts."}

Question: ${q}

Posts:
${ctx}`;
  if(sampleNS){
    askCtl?.abort(); askCtl=new AbortController(); ai.textContent="Thinking…";
    try{ const r = await sampleNS(prompt,{signal:askCtl.signal, cache:false, modelTier:"quick", onText:({text})=>{ai.textContent=text; ai.classList.remove("muted");}}); ai.textContent=r.text; ai.classList.remove("muted"); }
    catch(e){ ai.textContent=""; }
  } else if(META.ask_endpoint){
    ai.textContent="Thinking…";
    try{ const r = await fetch(META.ask_endpoint,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({prompt})}); const j=await r.json(); ai.textContent=j.text||""; ai.classList.remove("muted"); }catch(e){ ai.textContent=""; }
  }
}
