<style>

<script>
const ENGINE = /*__ENGINE__*/null;
const EVID = /*__EVIDENCE__*/[];
const STORY = /*__STORY__*/{};
const META = /*__META__*/{};

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n).toLocaleString("en-IN");
const pct = (a,b) => b ? Math.round(100*a/b) + "%" : "–";
const SRC = {play_store:"Google Play", app_store:"App Store", reddit:"Reddit", help_forum:"Photos Help Community", youtube:"YouTube", hacker_news:"Hacker News", stack_exchange:"Stack Exchange", play_store_deep:"Google Play"};
const NICE = {other:"Not stated / other", person:"Person", pet:"Pet", video:"Video", food:"Food", object:"Object", medical:"Medical", unknown:"Not stated", trip_place:"Trip / place", event_occasion:"Event / occasion", child_family:"Child / family", screenshot_info:"Screenshot", document_id:"Document / ID", receipt_bill:"Receipt / bill", product_shopping:"Product / shopping", text_in_image:"Text in image", old_scanned:"Old / scanned", scroll_timeline:"Scrolled the timeline", gave_up:"Gave up", other_app:"Used another app", albums_folders:"Albums / folders", people_tab:"People tab", date_jump:"Jumped to a date", ask_someone:"Asked someone", map_or_places:"Map / places", third_party_tool:"Third-party tool", not_found:"Not found", found_with_effort:"Found with effort", retrieval_story:"Retrieval story", search_feedback:"Search feedback", off_goal:"Off-goal", none:"None"};
const nice = s => (ENGINE.stage_labels||{})[s] || NICE[s] || String(s||"").replace(/_/g," ");
const CUE = {rough_time:"Rough time", exact_date:"Exact date", place:"Place", person:"Person", object:"Object / thing in it", text_in_image:"Words in the image", event_context:"The event", life_context:"What was going on in life", visual_look:"How it looked (colour, scene)", source_app:"Which app it came from", why_taken:"Why they took it", device:"Device", date:"Date", album_folder:"Album / folder", what_to_type:"What to type", who_sent:"Who sent it", which_account_device:"Which account / device", filename:"File name"};
const cue = c => CUE[c] || nice(c);

const TABS = [["overview","Overview"],["ask","Ask the engine"],["map","Opportunities"],["segments","Segments"],["cues","Memory cues"],["evidence","Evidence"],["method","Method & quality"]];
function show(id){
  TABS.forEach(([t]) => { $("#t-"+t).hidden = t!==id; $("#tab-"+t).setAttribute("aria-selected", t===id); });
  try{ localStorage.setItem("tab", id) }catch(e){}
}
$("#tabs").innerHTML = TABS.map(([t,l]) => `<button role="tab" id="tab-${t}" aria-selected="false">${l}</button>`).join("");
TABS.forEach(([t]) => $("#tab-"+t).onclick = () => show(t));

function bars(list, total, color, fmtLabel=cue){
  const max = Math.max(1, ...list.map(x=>x[1]));
  return list.map(([k,v]) => `<div class="bar"><span>${esc(fmtLabel(k))}</span><div class="track"><div class="fill" style="width:${100*v/max}%;background:${color}"></div></div><span class="num muted">${total?pct(v,total):fmt(v)}</span></div>`).join("");
}

/* ---------- Shared analysis helpers ---------- */
const clean = v => v && !/^\s*(none|none_stated|unknown|other)\s*$/.test(v);
const segsOf = r => (r.segment_signal||[]).map(s=>String(s).trim());
const SEG = {android:"Android users", ios:"iPhone users", web:"Web / desktop users", large_library:"Large libraries", heavy_screenshots:"Heavy screenshot takers", parent:"Parents", traveller:"Travellers", professional:"Using it for work", uses_as_document_store:"Store documents in Photos", older_user:"Older users"};
const STORIES = EVID.filter(r=>r.relevance==="retrieval_story");
const KNOWN = r => ["not_found","found","found_with_effort"].includes(r.outcome);
// "Never found" everywhere = share of retrieval stories with a known ending where the photo was never found (same basis as the 73% headline).
const nfRate = rows => { const k=rows.filter(r=>r.relevance==="retrieval_story"&&KNOWN(r)); return k.length ? k.filter(r=>r.outcome==="not_found").length/k.length : null; };
const topOf = (rows, key, n=1) => { const m={}; rows.forEach(r=>[].concat(r[key]||[]).forEach(v=>{ if(clean(v)) m[v]=(m[v]||0)+1; })); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n); };
// Which segments show up more often in these posts than in the data overall (lift), with at least `min` posts.
function overIndexed(rows, min=5){
  const all={}, sub={}; EVID.forEach(r=>segsOf(r).forEach(s=>all[s]=(all[s]||0)+1)); rows.forEach(r=>segsOf(r).forEach(s=>sub[s]=(sub[s]||0)+1));
  return Object.keys(SEG).filter(s=>(sub[s]||0)>=min).map(s=>[s, sub[s], (sub[s]/rows.length)/(all[s]/EVID.length)]).sort((a,b)=>b[2]-a[2]);
}
function strength(n, sources){ return n>=300&&sources>=6 ? "High" : n>=60&&sources>=3 ? "Medium" : "Low"; }

function renderSegments(){

  const rows=Object.keys(SEG).map(k=>{ const rs=EVID.filter(r=>segsOf(r).includes(k)), ss=rs.filter(r=>r.relevance==="retrieval_story");

    const lift=Object.entries(st).filter(([s,v])=>v>=5).map(([s,v])=>[s,v,(v/ns)/(allStage[s]/nStage)]).sort((a,b)=>b[2]-a[2])[0];

// Readable detail for one problem: mini bars for photo types and workarounds, then the plan it feeds.
function miniBars(list, color, f=nice){
  const L=list.filter(([k])=>clean(k)).slice(0,4), max=Math.max(1,...L.map(x=>x[1]));
  return L.length ? L.map(([k,v])=>`<div class="mbar"><span>${esc(f(k))}</span><div class="track"><div class="fill" style="width:${100*v/max}%;background:${color}"></div></div><b class="num">${v}</b></div>`).join("") : '<p class="muted small">Not stated</p>';
}
function oppBody(o){
  const s=(STORY.synthesis?.stages||{})[o.stage]||{};
  return `<div class="oppgrid">
    <div class="mini"><div class="eyebrow">Photos it hits most</div>${miniBars(o.content_types, "var(--g-blue)")}</div>
    <div class="mini"><div class="eyebrow">What people do instead</div>${miniBars(o.workarounds, "var(--g-yellow)")}</div>
  </div>
  ${s.need?`<div class="plan"><div><span class="eyebrow">Need</span>${esc(s.need)}</div><div><span class="eyebrow">Tests</span>${(s.hyp||[]).join(", ")||"–"}</div><div><span class="eyebrow">Product bet</span>${esc(s.bet)}</div><div><span class="eyebrow">Metric</span>${esc(s.metric)}</div></div>`:""}`;
}
function probStats(stage){
  const o=(ENGINE.opportunities||[]).find(x=>x.stage===stage), rows=EVID.filter(r=>(r.failure_stage||"").trim()===stage);
  const w=overIndexed(rows,15).filter(x=>x[2]>=1.15)[0];
  return {label:o.label, score:o.score, n:o.mentions, nf:nfRate(rows), sev:o.severity, srcs:o.sources, addr:o.addressable,
    types:topOf(rows.filter(r=>r.relevance==="retrieval_story"),"content_type",3), cues:topOf(rows,"cues_remembered",3), wa:topOf(rows,"workaround",2),
    who: w?`${esc(SEG[w[0]])} (${w[2].toFixed(1)}×)`:"No group stands out", syn:(STORY.synthesis?.stages||{})[stage]||{}};
}

  const max = Math.max(1,...types.flatMap(([t])=>stages.map(s=>M[t]?.[s]||0)));

    <div class="filters"><select id="cmp-a" aria-label="First problem">${O.map((o,i)=>`<option value="${o.stage}"${i===0?" selected":""}>${esc(o.label)}</option>`).join("")}</select>

  <h2>Photo type × where it broke</h2>
  <p class="muted">Retrieval stories only. Click a cell to see those posts in Evidence.</p>
  <div class="tablewrap"><table class="heat"><thead><tr><th></th>${stages.map(s=>`<th title="${esc(nice(s))}">${esc(s.replace(/_/g," "))}</th>`).join("")}</tr></thead><tbody>

      ${row("Posts",fmt(A.n),fmt(B.n),A.n,B.n,true)}
      ${row("Never found the photo",pct(A.nf*100,100),pct(B.nf*100,100),A.nf,B.nf,true)}

      ${row("Sources it shows up in",A.srcs+" of 7",B.srcs+" of 7",A.srcs,B.srcs,true)}

  $("#cmp-a").onchange=drawCmp; $("#cmp-b").onchange=drawCmp; drawCmp();
  $("#t-map").querySelectorAll("td.c").forEach(td=>td.onclick=()=>{ $("#f-type").value=td.dataset.t; $("#f-stage").value=td.dataset.s; $("#f-rel").value="retrieval_story"; drawEvidence(); show("evidence"); });
}

    readList = sorted.slice(0,116); const inR=new Set(readList); readList = readList.concat(rows.filter(r=>/^found/.test(r.outcome||"")&&!inR.has(r)).slice(0,4));
    const ctx = readList.map((r,i)=> i<8 ? `[${i+1}] (${SRC[r.source]||r.source}; photo: ${nice(r.content_type)}; problem: ${nice((r.failure_stage||"").trim())}; outcome: ${nice(r.outcome||"not stated")}) ${r.quote||""} | ${(r.text||"").slice(0,380)}`
      : `[${i+1}] (${nice((r.failure_stage||"").trim())}; ${nice(r.outcome||"not stated")}) wanted: ${r.user_need||""} | "${r.quote||""}"`).join("\n");
    let setTxt = `This question is about ${scope.name} (${rows.length} posts from ${nSrc} sources; evidence strength ${st}).`;

    const fmtLabs = `You are synthesising, not reporting. A product manager wants to understand what is really going on for these users and what to do about it, the way a thoughtful researcher would explain it after reading every post. Numbers are only supporting evidence: use at most 3 in the whole reply, and only where they change the conclusion.

Write short paragraphs, each starting with one of these lead-ins followed by a colon. Use the ones that help answer the question, in this order, and skip any that add nothing:
The insight: 1 or 2 sentences that reframe the problem in human terms (what users are actually experiencing and why it matters), answering the question asked.${scope.kind==="compare"?" Say which side has the deeper problem and what makes the two different in kind, not just in size.":""}

    prompt = `You are a senior user researcher helping a product manager decide which Google Photos retrieval problem to work on. Your job is to identify and compare problems and opportunity areas using evidence from real users, not to summarise reviews or sentiment. Use ONLY the numbers and numbered posts below. Every number you write must come from them.

${setTxt}
${rankBlock}

Groups that show up more than usual: ${whoTxt}.
Groups inside this set: ${segBreak||"too few posts name a group"}. Overall never-found rate: ${Math.round(nfRate(STORIES)*100)}%.
${hist?`\nEarlier in this chat (use it to understand follow-up questions):\n${hist}\n`:""}

${focus}

How to reply:
${fmtLabs}

Posts:
${ctx}`;
    const glance = `Photo types: ${c.types.slice(0,3).map(([a,b])=>`${esc(nice(a))} (${b})`).join(", ")||"–"} · Remembered: ${c.remembered.slice(0,3).map(([a,b])=>`${esc(cue(a))} (${b})`).join(", ")||"–"} · Did instead: ${c.workarounds.slice(0,2).map(([a,b])=>`${esc(nice(a))} (${b})`).join(", ")||"–"}`;
